  "usage": {
    "display_name": "Flow Drive",
    "summary": "Execute one scoped task with diagnosis and acceptance evidence",
    "syntax": "$flow-drive <task-text|task-file|confirmed-spec-or-change-id> [--worker=auto|provider[/model[:effort]]] [--reasoner=provider[/model[:effort]]] [--cross] [--plan[=auto|bounded|discovery]] [--architect|--no-architect]",
    "input_kind": "mixed",
    "inputs": [
      {
        "id": "task-input",
        "syntax": "<task-text|task-file|confirmed-spec-or-change-id>",
        "value_kind": "string",
        "required": true,
        "summary": "Provide one task text argument, task file path, or confirmed specification/change ID; quote text and paths containing spaces",
        "applies_to": [
          "apply"
        ]
      }
    ],
    "invocation_class": "explicit-only",
    "effect_authority": "workspace-write",
    "actions": [
      {
        "id": "apply",
        "summary": "Resolve task text, a file or confirmed ID; diagnose prerequisites, implement assigned items and verify acceptance",
        "syntax": "$flow-drive <task-text|task-file|confirmed-spec-or-change-id>",
        "input_kind": "mixed",
        "effect_authority": "workspace-write"
      }
    ],
    "options": [
      {
        "id": "plan",
        "syntax": "--plan[=auto|bounded|discovery]",
        "value_kind": "enum",
        "required": false,
        "summary": "Request a planner scope using the current Host declared effective target",
        "applies_to": [
          "apply"
        ],
        "enum_values": [
          "auto",
          "bounded",
          "discovery"
        ]
      },
      {
        "id": "worker",
        "syntax": "--worker=auto|provider[/model[:effort]]",
        "value_kind": "string",
        "required": false,
        "summary": "Select automatic native candidates, one Provider, or an exact Worker target; external intent still requires a current Host grant",
        "applies_to": [
          "apply"
        ],
        "default": "auto"
      },
      {
        "id": "cross",
        "syntax": "--cross",
        "value_kind": "boolean",
        "required": false,
        "default": false,
        "summary": "Expand automatic candidates for this invocation only; obtain grants before selected external probes or launches",
        "applies_to": [
          "apply"
        ]
      },
      {
        "id": "reasoner",
        "syntax": "--reasoner=<provider>[/<model>[:<effort>]]",
        "value_kind": "string",
        "required": false,
        "summary": "Request a read-only reasoner whose verified READY_FOR_DISPATCH conclusion gates dependent writers",
        "applies_to": [
          "apply"
        ]
      },
      {
        "id": "architect",
        "syntax": "--architect",
        "value_kind": "boolean",
        "required": false,
        "summary": "Request consultation; report UNAVAILABLE when the current Host has no supported architecture route",
        "applies_to": [
          "apply"
        ]
      },
      {
        "id": "no-architect",
        "syntax": "--no-architect",
        "value_kind": "boolean",
        "required": false,
        "summary": "Suppress an optional consult while preserving required Host gates",
        "applies_to": [
          "apply"
        ]
      },
      {
        "id": "codex",
        "syntax": "--codex",
        "value_kind": "boolean",
        "required": false,
        "summary": "Request the retired Codex diagnostic",
        "legacy": {
          "replacement_id": "worker",
          "diagnostic_only": true,
          "reason": "Use an explicit worker or reasoner instead of the retired Codex shortcut"
        },
        "applies_to": [
          "apply"
        ]
      }
    ],
    "examples": [
      {
        "prompt": "$flow-drive \"Fix the receipt total and verify it matches the receipt lines.\"",
        "summary": "Resolve and implement a bounded task with explicit acceptance"
      },
      {
        "prompt": "$flow-drive \"Diagnose the display symptom, repair the receipt total, and draft an assigned manual proposal.\" --cross",
        "summary": "Request additional Provider candidates under the selected interface authorization contract; unknown cause gates only dependent writes"
      }
    ]
  },
  "commands": [
    {
      "id": "flow-drive",
      "host_surface": "claude-command",
      "public_name": "/dhpk:flow-drive",
      "argument_contract": "<confirmed-spec-or-change-id> [--plan[=<model>:<effort>]] [--worker=<worker>] [--worker-target=<provider>/<model>[:<effort>]] [--cross-provider] [--reasoner=<provider>/<model>[:<effort>]] [--architect|--no-architect]",
      "authority": "workspace-write",
      "disposition": "thin-front-door",
      "evidence": {
        "structural": "PASS",
        "host_smoke": "NOT_RUN",
        "consumer": "NOT_RUN",
        "source": "commands/flow-drive.md"
      },
      "outcome": "retain",
      "callers": [
        "commands/flow-drive.md"
      ],
      "reason": "Canonical $flow-drive Skill owns behavior; this Claude command preserves its public grammar and evidence boundary.",
      "allowed_tools": "Read, Grep, Glob, Bash, Skill, Agent"
    }
  ]
