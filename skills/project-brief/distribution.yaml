{
  "schema": "dhpk.skill-distribution.v1",
  "coverage": {
    "entry": "SKILL.md",
    "references": [
      "agents/openai.yaml"
    ],
    "executable_entries": [],
    "host_capabilities": []
  },
  "usage": {
    "display_name": "Project Brief",
    "summary": "Convert one technical specification into an executive brief",
    "syntax": "$project-brief <tech-spec-path> [--output=<output-path>]",
    "input_kind": "path",
    "invocation_class": "implicit-eligible",
    "effect_authority": "workspace-write",
    "inputs": [
      {
        "id": "tech-spec-path",
        "syntax": "<tech-spec-path>",
        "value_kind": "string",
        "required": true,
        "summary": "Readable technical specification"
      }
    ],
    "actions": [
      {
        "id": "brief",
        "summary": "Write an executive summary without changing the source",
        "syntax": "$project-brief <tech-spec-path>",
        "input_kind": "path",
        "effect_authority": "workspace-write"
      }
    ],
    "options": [
      {
        "id": "output",
        "syntax": "--output=<output-path>",
        "value_kind": "string",
        "required": false,
        "summary": "Destination for the brief"
      }
    ],
    "examples": [
      {
        "prompt": "$project-brief docs/spec.md --output=docs/brief.md",
        "summary": "Use project brief with its declared interface"
      }
    ]
  }
}
