  "usage": {
    "display_name": "Flow Guide",
    "summary": "Guide routes, rules, next steps, closeout, and usage help",
    "syntax": "$flow-guide <help|route|rules|next|close> [--go] [--host <host>] [<query>]",
    "input_kind": "action-first",
    "inputs": [
      {
        "id": "action",
        "syntax": "<help|route|rules|next|close>",
        "value_kind": "enum",
        "required": true,
        "summary": "Choose one read-only guide action",
        "enum_values": [
          "help",
          "route",
          "rules",
          "next",
          "close"
        ]
      },
      {
        "id": "query",
        "syntax": "<query>",
        "value_kind": "string",
        "required": false,
        "summary": "Provide the action-specific skill or workflow text",
        "applies_to": [
          "help",
          "route",
          "rules",
          "next",
          "close"
        ]
      }
    ],
    "invocation_class": "implicit-eligible",
    "effect_authority": "delegate",
    "actions": [
      {
        "id": "help",
        "summary": "Show available Codex usage or one usage card",
        "syntax": "$flow-guide help [<skill>]",
        "input_kind": "identifier",
        "effect_authority": "read-only"
      },
      {
        "id": "route",
        "summary": "Select the smallest workflow owner for a task",
        "syntax": "$flow-guide route [--go] [<query>]",
        "input_kind": "free-text",
        "effect_authority": "delegate"
      },
      {
        "id": "rules",
        "summary": "Look up the governing workflow rules",
        "syntax": "$flow-guide rules [<query>]",
        "input_kind": "free-text",
        "effect_authority": "read-only"
      },
      {
        "id": "next",
        "summary": "Identify the next bounded workflow action",
        "syntax": "$flow-guide next [--host <host>] [<query>]",
        "input_kind": "free-text",
        "effect_authority": "read-only"
      },
      {
        "id": "close",
        "summary": "Check closeout evidence and remaining gates",
        "syntax": "$flow-guide close [<query>]",
        "input_kind": "free-text",
        "effect_authority": "read-only"
      }
    ],
    "options": [
      {
        "id": "go",
        "syntax": "--go",
        "value_kind": "boolean",
        "required": false,
        "default": false,
        "summary": "Request one bounded handoff when the route is eligible",
        "applies_to": [
          "route"
        ]
      },
      {
        "id": "host",
        "syntax": "--host",
        "value_kind": "enum",
        "required": false,
        "default": "claude-code",
        "summary": "Select next-action invocation formatting and handoff Host; Codex passes codex-cli",
        "enum_values": [
          "claude-code",
          "codex-cli",
          "agy",
          "cursor",
          "claude",
          "codex"
        ],
        "applies_to": [
          "next"
        ]
      }
    ],
    "examples": [
      {
        "prompt": "$flow-guide help",
        "summary": "List the available Codex skill usage contracts"
      },
      {
        "prompt": "$flow-guide next --host codex-cli",
        "summary": "Resolve declared next steps using Codex invocation formatting"
      }
    ]
  },
