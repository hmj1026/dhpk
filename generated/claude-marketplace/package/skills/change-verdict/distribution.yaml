  "usage": {
    "display_name": "Change Verdict",
    "summary": "Review changes or audit dependencies with bounded explicit fixes",
    "syntax": "$change-verdict [--mode=<mode>] [<target>] | pending [--files=<paths>] | deps [fix] [--level=<severity>]",
    "input_kind": "mixed",
    "invocation_class": "implicit-eligible",
    "effect_authority": "workspace-write",
    "inputs": [
      {
        "id": "target",
        "syntax": "<target>",
        "value_kind": "string",
        "required": false,
        "summary": "Change, PR, test, document, or risk target"
      }
    ],
    "actions": [
      {
        "id": "code",
        "summary": "Judge code changes",
        "syntax": "$change-verdict --mode=code [<target>]",
        "input_kind": "mixed",
        "effect_authority": "read-only"
      },
      {
        "id": "pr",
        "summary": "Judge pull-request evidence",
        "syntax": "$change-verdict --mode=pr [<target>]",
        "input_kind": "mixed",
        "effect_authority": "read-only"
      },
      {
        "id": "security",
        "summary": "Judge security evidence",
        "syntax": "$change-verdict --mode=security [<target>]",
        "input_kind": "mixed",
        "effect_authority": "read-only"
      },
      {
        "id": "tests",
        "summary": "Judge test and coverage evidence",
        "syntax": "$change-verdict --mode=tests [--coverage] [<target>]",
        "input_kind": "mixed",
        "effect_authority": "read-only"
      },
      {
        "id": "docs",
        "summary": "Judge documentation evidence",
        "syntax": "$change-verdict --mode=docs [<target>]",
        "input_kind": "mixed",
        "effect_authority": "read-only"
      },
      {
        "id": "risk",
        "summary": "Judge change-risk evidence",
        "syntax": "$change-verdict --mode=risk [<target>]",
        "input_kind": "mixed",
        "effect_authority": "read-only"
      },
      {
        "id": "pending",
        "summary": "Delegate a read-only pending-change review",
        "syntax": "$change-verdict pending [--files=<paths>]",
        "input_kind": "none",
        "effect_authority": "read-only"
      },
      {
        "id": "deps",
        "summary": "Audit dependency risks without mutation",
        "syntax": "$change-verdict deps [--level=<severity>]",
        "input_kind": "none",
        "effect_authority": "read-only"
      },
      {
        "id": "deps-fix",
        "summary": "Delegate requested bounded dependency remediation then obtain an independent verdict",
        "syntax": "$change-verdict deps fix [--level=<severity>]",
        "input_kind": "none",
        "effect_authority": "workspace-write"
      }
    ],
    "options": [
      {
        "id": "mode",
        "syntax": "--mode=<mode>",
        "value_kind": "enum",
        "required": false,
        "summary": "Select one verdict mode",
        "enum_values": [
          "code",
          "pr",
          "security",
          "tests",
          "docs",
          "risk"
        ]
      },
      {
        "id": "coverage",
        "syntax": "--coverage",
        "value_kind": "boolean",
        "required": false,
        "summary": "Include coverage evidence in tests mode",
        "default": false
      },
      {
        "id": "files",
        "syntax": "--files=<paths>",
        "value_kind": "string",
        "required": false,
        "summary": "Comma-separated relative pending paths"
      },
      {
        "id": "level",
        "syntax": "--level=<severity>",
        "value_kind": "enum",
        "required": false,
        "summary": "Minimum vulnerability severity",
        "default": "moderate",
        "enum_values": [
          "low",
          "moderate",
          "high",
          "critical"
        ]
      },
      {
        "id": "fix",
        "syntax": "--fix",
        "value_kind": "boolean",
        "required": false,
        "summary": "Explicitly request bounded dependency remediation",
        "default": false
      }
    ],
    "examples": [
      {
        "prompt": "$change-verdict --mode=tests --coverage",
        "summary": "Use change verdict with its declared interface"
      },
      {
        "prompt": "$change-verdict pending --files=src/a.js",
        "summary": "Delegate pending review"
      },
      {
        "prompt": "$change-verdict deps --level=high",
        "summary": "Audit dependencies without mutation"
      },
      {
        "prompt": "$change-verdict deps fix",
        "summary": "Request bounded dependency remediation"
      }
    ]
  }
}
