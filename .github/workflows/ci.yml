name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: CI change plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          CHECKOUT_SHA: ${{ github.sha }}
        run: |
          plan="$(node scripts/ci/ci-plan.js plan --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" --checkout-sha "$CHECKOUT_SHA" --base-ref "$BASE_REF")"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "mode=$(node -e 'console.log(JSON.parse(process.argv[1]).mode)' "$plan")" >> "$GITHUB_OUTPUT"

  preflight:
    name: Preflight
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dhpk-test-env

      - name: Validate workflow syntax
        if: needs.plan.outputs.mode == 'full'
        uses: reviewdog/action-actionlint@23bcc6aa6e2ccffe1e7730111b98ddcaf34cb098 # v1.76.3
        with:
          actionlint_flags: -color
          fail_level: error
      - name: Validate workflow policy
        run: node scripts/ci/validate-workflow-policy.js
      - name: Validate JSON CLI termination
        run: node scripts/ci/validate-json-cli-termination.js
      - name: Validate JavaScript guardrails
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/validate-js-guardrails.js

      # Structure check (bash). Exit 1 = errors (fail); exit 2 = warnings (ok).
      - name: Harness structure
        if: needs.plan.outputs.mode == 'full'
        run: bash scripts/validate/validate-harness.sh || [ $? -eq 2 ]

      # Zero-dep Node validators in strict mode (warnings become errors).
      - name: Validate agents
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/validate-agents.js --strict
      - name: Validate skills
        run: node scripts/ci/validate-skills.js --strict
      - name: Validate commands
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/validate-commands.js --strict
      - name: Validate modules
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/validate-modules.js --strict
      - name: Validate plugin manifest
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/validate-plugin.js --strict
      - name: Validate distribution inventory
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/validate-distribution.js --strict
      - name: Validate skill resource copies
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/sync-skill-resources.js --check
      # Public facade smoke check. Exit 2 is an explicit non-pass evidence
      # state (for example an unavailable local consumer), not a shell error;
      # deterministic failures and usage errors still fail CI.
      - name: Harness facade preflight
        if: needs.plan.outputs.mode == 'full'
        run: |
          set +e
          bin/dhpk harness preflight --json
          status=$?
          set -e
          case "$status" in
            0|2) exit 0 ;;
            *) exit "$status" ;;
          esac
      - name: Validate retained distribution packages
        if: needs.plan.outputs.mode == 'full'
        run: |
          for surface in agent-plugin cursor-plugin codex-native agy-plugin; do
            bin/dhpk distribution "$surface" validate --json
          done
      - name: Validate Cursor project-local sync
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/validate-cursor-sync.js
      - name: Verify platform package determinism
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/verify-platform-packages.js
      - name: No-drift Claude manifest check
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/gen-claude-manifest.js --check
      - name: No-drift Claude marketplace package check
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/gen-claude-marketplace-package.js --check
      - name: No-drift Claude profile bundles check
        if: needs.plan.outputs.mode == 'full'
        run: |
          for profile in minimal full compat-v1; do
            node scripts/ci/gen-claude-profile-bundles.js --profile "$profile" --check
          done
      - name: Validate invocation policy
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/validate-invocation-policy.js

      - name: Validate default discovery aggregate budget
        run: node scripts/ci/context-budget.js --aggregate
        continue-on-error: true

      # Agent-spawn context ledger: static estimates are separate from runtime
      # token telemetry, which is supplied by the host when available.
      - name: Validate subagent context ledger
        run: node scripts/ci/subagent-context-budget.js
        continue-on-error: true

      # Count SSOT: README / manifest exact claims must match reality.
      - name: Catalog count check
        env:
          SUITE_ADMISSION_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/catalog.js --check all --diff-base "$SUITE_ADMISSION_DIFF_BASE"

      # Release-note fragment schema (always) + PR coverage (base ref must exist locally).
      - name: Validate changelog fragments
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          CHANGELOG_ARGS=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            CHANGELOG_ARGS=(--diff-base "origin/$BASE_REF" --base-ref "$BASE_REF")
            if [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
              CHANGELOG_ARGS+=(--bot-authored)
            fi
          fi
          node scripts/ci/validate-changelog-fragments.js "${CHANGELOG_ARGS[@]}"

  tests:
    name: Tests (shard ${{ matrix.shard }}/4)
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dhpk-test-env

      - name: Run bounded repository test shard
        env:
          DHPK_BOUNDED_REQUIRE_CGROUP: '1'
          DHPK_TEST_JOBS: '4'
          DHPK_TEST_TIMING_FILE: ${{ runner.temp }}/dhpk-test-timing.json
          DHPK_TEST_SOURCE_COMMIT: ${{ github.sha }}
          DHPK_TEST_RUN_ID: ${{ github.run_id }}
          DHPK_TEST_RUN_ATTEMPT: ${{ github.run_attempt }}
          DHPK_TEST_EVENT: ${{ github.event_name }}
          DHPK_TEST_REF: ${{ github.ref }}
          DHPK_TEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DHPK_TEST_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          DHPK_TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: ./scripts/ci/run-bounded-node-test.sh node tests/run-all.js --shard-index ${{ matrix.shard }} --shard-count 4

      - name: Summarize test shard timing
        if: always()
        env:
          DHPK_TEST_TIMING_FILE: ${{ runner.temp }}/dhpk-test-timing.json
        run: node scripts/ci/render-test-timing.js --file "$DHPK_TEST_TIMING_FILE" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload test shard timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dhpk-test-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/dhpk-test-timing.json
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Validate harness assets
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [plan, preflight, tests, macos-installer, release-rehearsal, lint]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify plan-bound required jobs
        if: always()
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          MACOS_RESULT: ${{ needs.macos-installer.result }}
          RELEASE_RESULT: ${{ needs.release-rehearsal.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          node - <<'NODE'
          const { verifyCiResults } = require('./scripts/lib/ci-plan');
          const result = verifyCiResults(JSON.parse(process.env.PLAN), {
            preflight: process.env.PREFLIGHT_RESULT, tests: process.env.TESTS_RESULT,
            'macos-installer': process.env.MACOS_RESULT, 'release-rehearsal': process.env.RELEASE_RESULT,
            lint: process.env.LINT_RESULT, validate: 'success',
          }, { root: process.cwd(), baseSha: process.env.BASE_SHA, headSha: process.env.HEAD_SHA, checkoutSha: process.env.CHECKOUT_SHA, baseRef: process.env.BASE_REF });
          if (!result.ok) { result.errors.forEach((error) => console.error(`::error::${error}`)); process.exit(1); }
          console.log('PASS: plan-bound required jobs');
          NODE

      - name: Download shard 0 timing evidence
        if: needs.plan.outputs.mode == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dhpk-test-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-0
          path: ${{ runner.temp }}/dhpk-test-shards/dhpk-test-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-0

      - name: Download shard 1 timing evidence
        if: needs.plan.outputs.mode == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dhpk-test-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-1
          path: ${{ runner.temp }}/dhpk-test-shards/dhpk-test-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-1

      - name: Download shard 2 timing evidence
        if: needs.plan.outputs.mode == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dhpk-test-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-2
          path: ${{ runner.temp }}/dhpk-test-shards/dhpk-test-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-2

      - name: Download shard 3 timing evidence
        if: needs.plan.outputs.mode == 'full'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dhpk-test-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-3
          path: ${{ runner.temp }}/dhpk-test-shards/dhpk-test-timing-${{ github.run_id }}-${{ github.run_attempt }}-shard-3

      - name: Verify shard coverage and timing evidence
        if: needs.plan.outputs.mode == 'full'
        run: node scripts/ci/verify-test-shards.js --directory "${{ runner.temp }}/dhpk-test-shards" --count 4 --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --checkout-sha '${{ github.sha }}' --head-sha '${{ github.event.pull_request.head.sha }}' --summary "$GITHUB_STEP_SUMMARY"

  macos-installer:
    name: macOS installer harness
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Linux-only cgroup/timeout cases are reported as SKIP_INCOMPATIBLE on
      # Darwin; the required fail-closed suite runs in the Ubuntu validate job.
      - name: macOS installer subset
        run: node tests/_lib/macos-installer-files.js

  # Release PRs only (base main): rehearse the paths that otherwise run for
  # the first time after the immutable tag exists (v0.60.0, v0.62.0, v0.62.1
  # and v0.63.0 all failed there). It reuses the tag job's own verification
  # script in dry-run mode and the post-publish consumer gate against the
  # local checkout. The full suite is not repeated: the `tests` matrix runs it
  # on the same tree in parallel. Read-only: it never tags, publishes, or pushes.
  release-rehearsal:
    name: Release rehearsal
    if: github.base_ref == 'main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dhpk-test-env

      - name: Rehearse release verification (dry-run)
        run: bash scripts/release/release-verify.sh --mode dry-run --out-dir "$RUNNER_TEMP"

      # Same CLI install and outcome mapping as the tag job's consumer-verify.
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code
        continue-on-error: true

      - name: Rehearse CONSUMER gate
        env:
          DHPK_RELEASE_ARTIFACT_MANIFEST: ${{ runner.temp }}/dhpk-release-artifact-manifest.json
          DHPK_HARNESS_RELEASE_PROBE_CONCURRENCY: '2'
          DHPK_HARNESS_RELEASE_PROBE_TIMEOUT_MS: '120000'
        run: |
          set +e
          result_file="$RUNNER_TEMP/harness-release-rehearsal.json"
          bin/dhpk harness release --json --task-id "release-rehearsal-${GITHUB_RUN_ID}" | tee "$result_file"
          probe_exit="${PIPESTATUS[0]}"
          set -e
          outcome="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).outcome)" "$result_file")"
          {
            echo "## Release rehearsal consumer gate"
            echo ""
            echo "Outcome: \`$outcome\` (pre-merge rehearsal; no tag or release exists)"
            echo ""
            node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); for (const row of (r.surfaceResults || [])) console.log('- ' + row.surface + ': ' + row.status);" "$result_file"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$outcome" in
            COMPLETE)
              [ "$probe_exit" -eq 0 ] || exit 1
              exit 0
              ;;
            PUBLISHED_PENDING)
              [ "$probe_exit" -eq 2 ] || exit 1
              echo "Consumer runtime evidence is pending on the rehearsal runner; keeping the job non-blocking."
              exit 0
              ;;
            PUBLISHED_UNHEALTHY|BLOCKED)
              echo "::error::Consumer rehearsal outcome is $outcome; the tag-time consumer-verify job would fail the same way." >&2
              exit 1
              ;;
            *)
              echo "::error::Unexpected consumer rehearsal outcome: $outcome" >&2
              exit 1
              ;;
          esac

  lint:
    name: Markdown lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            *.md
            agent-traps/**/*.md
            agents/**/*.md
            changelog.d/**/*.md
            codex/*.md
            codex/supporting/**/*.md
            # Lint installed Codex projections when present; runtime artifacts
            # and transaction backups under .codex/ are intentionally excluded.
            commands/**/*.md
            docs/**/*.md
            rules/**/*.md
            modules/**/*.md
            openspec/**/*.md
            skills/**/*.md
            templates/**/*.md
