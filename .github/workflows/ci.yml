name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate harness assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Structure check (bash). Exit 1 = errors (fail); exit 2 = warnings (ok).
      - name: Harness structure
        run: bash scripts/validate/validate-harness.sh || [ $? -eq 2 ]

      # Zero-dep Node validators in strict mode (warnings become errors).
      - name: Validate agents
        run: node scripts/ci/validate-agents.js --strict
      - name: Validate skills
        run: node scripts/ci/validate-skills.js --strict
      - name: Validate commands
        run: node scripts/ci/validate-commands.js --strict
      - name: Validate modules
        run: node scripts/ci/validate-modules.js --strict
      - name: Validate plugin manifest
        run: node scripts/ci/validate-plugin.js --strict
      - name: Validate distribution inventory
        run: node scripts/ci/validate-distribution.js --strict
      # Public facade smoke check. Exit 2 is an explicit non-pass evidence
      # state (for example an unavailable local consumer), not a shell error;
      # deterministic failures and usage errors still fail CI.
      - name: Harness facade preflight
        run: |
          set +e
          bin/dhpk harness preflight --json
          status=$?
          set -e
          case "$status" in
            0|2) exit 0 ;;
            *) exit "$status" ;;
          esac
      - name: Validate retained distribution packages
        run: |
          for surface in agent-plugin cursor-plugin codex-native agy-plugin; do
            bin/dhpk distribution "$surface" validate --json
          done
      - name: Validate Cursor project-local sync
        run: node scripts/ci/validate-cursor-sync.js
      - name: Verify platform package determinism
        run: node scripts/ci/verify-platform-packages.js
      - name: No-drift Claude manifest check
        run: node scripts/ci/gen-claude-manifest.js --check
      - name: Validate invocation policy
        run: node scripts/ci/validate-invocation-policy.js

      # Agent-spawn context ledger: static estimates are separate from runtime
      # token telemetry, which is supplied by the host when available.
      - name: Validate subagent context ledger
        run: node scripts/ci/subagent-context-budget.js

      # Count SSOT: README / manifest exact claims must match reality.
      - name: Catalog count check
        run: node scripts/ci/catalog.js --check

      # Release-note fragment schema (always) + PR coverage (base ref must exist locally).
      - name: Validate changelog fragments
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          CHANGELOG_ARGS=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            CHANGELOG_ARGS=(--diff-base "origin/$BASE_REF" --base-ref "$BASE_REF")
          fi
          node scripts/ci/validate-changelog-fragments.js "${CHANGELOG_ARGS[@]}"

      # Regression tests (plugin paths, hook wiring, catalog<->modules).
      - name: Tests
        env:
          DHPK_BOUNDED_REQUIRE_CGROUP: '1'
          DHPK_TEST_JOBS: '4'
        run: ./scripts/ci/run-bounded-node-test.sh node tests/run-all.js

  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            agents/**/*.md
            skills/**/*.md
            commands/**/*.md
            rules/**/*.md
            modules/**/*.md
