name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      release_pr_head_sha: ${{ steps.resolve-release-pr.outputs.head_sha }}
      release_target_commit: ${{ steps.release-verify.outputs.target_commit }}
      release_target_tree: ${{ steps.release-verify.outputs.target_tree }}
      release_verifier_sha256: ${{ steps.release-verify.outputs.verifier_sha256 }}
      release_notes_sha256: ${{ steps.release-verify.outputs.notes_sha256 }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dhpk-test-env

      # One implementation shared with the release-PR `release-rehearsal` CI
      # job (dry-run mode), so these stages have already run on this tree
      # before the tag existed. Tag mode first proves the tag is vX.Y.Z and
      # contained in origin/main, then checks parity, harness preflight,
      # packages, and writes the trusted artifact manifest, the exact
      # release-note bytes, the publication bundle, and the verifier binding
      # into $RUNNER_TEMP. It runs before the suite so a bad tag fails fast.
      - name: Verify release candidate
        id: release-verify
        run: bash scripts/release/release-verify.sh --mode tag --tag "$GITHUB_REF_NAME" --out-dir "$RUNNER_TEMP"

      # Re-run the full source test suite on the immutable tag with the same
      # strong containment contract as CI. Local macOS publish preflight may
      # use the portable adapter, but release authority stays on Linux.
      - name: Verify bounded repository tests
        env:
          DHPK_BOUNDED_REQUIRE_CGROUP: '1'
          DHPK_TEST_JOBS: '4'
        run: ./scripts/ci/run-bounded-node-test.sh node tests/run-all.js

      - name: Resolve merged release PR head
        id: resolve-release-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          merge_sha="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          head_sha="$(gh pr list --base main --head develop --state merged --limit 100 --json mergeCommit,headRefOid | MERGE_SHA="$merge_sha" node -e '
            const fs = require("fs");
            const prs = JSON.parse(fs.readFileSync(0, "utf8"));
            const match = prs.find((pr) => pr.mergeCommit && pr.mergeCommit.oid === process.env.MERGE_SHA);
            process.stdout.write(match ? (match.headRefOid || "") : "");
          ')"
          if [ -z "$head_sha" ]; then
            echo "release workflow: could not resolve the merged release PR head for $merge_sha" >&2
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "release workflow: merged release PR head=$head_sha"

      # The post-publish job verifies this manifest against the immutable tag
      # before it starts any consumer probe; it never regenerates a package or
      # treats a generic cache hit as evidence.
      - name: Upload trusted release artifact manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dhpk-release-artifact-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/dhpk-release-artifact-manifest.json
          if-no-files-found: error
          retention-days: 7

      # The bundle binds the exact release-note bytes and publication identity
      # that the write-enabled publication job may consume. Its validator is
      # repository-independent so that consumer can verify it without a
      # checkout or release-note regeneration.
      - name: Upload trusted publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dhpk-release-publication-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/dhpk-release-publication-bundle.json
          if-no-files-found: error
          retention-days: 7

      # Keep the extraction digest as an independent, run-bound consumer input.
      - name: Upload trusted publication notes digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dhpk-release-publication-notes-digest-${{ github.run_id }}
          path: ${{ runner.temp }}/dhpk-release-publication-notes-digest.json
          if-no-files-found: error
          retention-days: 7

      # The consumer verifier has no repository dependencies and is shipped as
      # a separate run-bound artifact; its digest is bound by release-verify.sh.
      - name: Upload trusted publication bundle verifier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dhpk-release-publication-bundle-verifier-${{ github.run_id }}
          path: scripts/release/verify-publication-bundle.js
          if-no-files-found: error
          retention-days: 7

  # The publication consumer deliberately has no checkout. It accepts only
  # run-bound artifacts emitted by the read-only validation job and publishes
  # the exact note bytes written by the downloaded standalone verifier.
  publish:
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download trusted publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dhpk-release-publication-bundle-${{ github.run_id }}
          path: ${{ runner.temp }}/dhpk-release-publication-bundle

      - name: Download trusted publication notes digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dhpk-release-publication-notes-digest-${{ github.run_id }}
          path: ${{ runner.temp }}/dhpk-release-publication-notes-digest

      - name: Download trusted publication bundle verifier
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dhpk-release-publication-bundle-verifier-${{ github.run_id }}
          path: ${{ runner.temp }}/dhpk-release-publication-bundle-verifier

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Validate trusted publication bundle
        env:
          TARGET_COMMIT: ${{ needs.release.outputs.release_target_commit }}
          TARGET_TREE: ${{ needs.release.outputs.release_target_tree }}
          VERIFIER_SHA256: ${{ needs.release.outputs.release_verifier_sha256 }}
          EXPECTED_NOTES_SHA256: ${{ needs.release.outputs.release_notes_sha256 }}
        run: |
          verifier="$RUNNER_TEMP/dhpk-release-publication-bundle-verifier/verify-publication-bundle.js"
          bundle="$RUNNER_TEMP/dhpk-release-publication-bundle/dhpk-release-publication-bundle.json"
          digest="$RUNNER_TEMP/dhpk-release-publication-notes-digest/dhpk-release-publication-notes-digest.json"
          validated_notes_file="$RUNNER_TEMP/dhpk-release-notes-validated.txt"
          test -f "$verifier" && test -f "$bundle" && test -f "$digest"
          if ! [[ "$VERIFIER_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "publication consumer: expected verifier digest is malformed" >&2
            exit 1
          fi
          actual_verifier_sha256="sha256:$(sha256sum "$verifier" | cut -d' ' -f1)"
          if [ "$actual_verifier_sha256" != "$VERIFIER_SHA256" ]; then
            echo "publication consumer: downloaded verifier digest does not match the producer binding" >&2
            exit 1
          fi
          node "$verifier" \
            --bundle "$bundle" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-tag "$GITHUB_REF_NAME" \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --expected-notes-sha256 "$EXPECTED_NOTES_SHA256" \
            --expected-notes-digest-file "$digest" \
            --expected-target-commit "$TARGET_COMMIT" \
            --expected-target-tree "$TARGET_TREE" \
            --notes-output "$validated_notes_file"

      - name: Create GitHub Release from validated bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # An existing release is preserved; tags and release metadata are immutable.
          if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; preserving it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file - < "$RUNNER_TEMP/dhpk-release-notes-validated.txt"
          fi

  # Post-publish CONSUMER verification (task 4.2). Runs on a fresh, ephemeral
  # runner — the only place it's safe to run `claude plugin install` for real
  # (a dev machine's install writes to the shared global plugin cache; the
  # harness delegates Claude and Codex adapters to consumer-gate.js). Reports
  # via the job summary only — never edits the immutable GitHub Release notes.
  consumer-verify:
    needs: [release, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Download trusted release artifact manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dhpk-release-artifact-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/dhpk-release-artifact

      # Installs the real `claude` CLI so the supported Claude
      # marketplace-add/install/list check runs for real here (this ephemeral
      # runner is the only place that's safe — see the job comment above). If
      # this install step itself fails, the facade records UNAVAILABLE for
      # that dimension rather than crashing.
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code
        continue-on-error: true

      - name: Run CONSUMER gate
        env:
          DHPK_RELEASE_ARTIFACT_MANIFEST: ${{ runner.temp }}/dhpk-release-artifact/dhpk-release-artifact-manifest.json
          DHPK_HARNESS_RELEASE_PROBE_CONCURRENCY: '2'
          DHPK_HARNESS_RELEASE_PROBE_TIMEOUT_MS: '120000'
        run: |
          set +e
          result_file="${RUNNER_TEMP:-/tmp}/harness-release-result.json"
          bin/dhpk harness release --json \
            --task-id "release-consumer-${GITHUB_REF_NAME#v}" \
            | tee "$result_file"
          probe_exit="${PIPESTATUS[0]}"
          set -e
          outcome="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).outcome)" "$result_file")"
          {
            echo "## Consumer verification — ${GITHUB_REF_NAME}"
            echo ""
            echo "Outcome: \`$outcome\`"
            echo ""
            node -e "const result=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); for (const row of (result.surfaceResults || [])) { const adapter = row.adapter && typeof row.adapter === 'object' ? row.adapter : {}; const version = row.surface === 'claude' && adapter.version ? ' (CLI ' + adapter.version + ')' : ''; console.log('- ' + row.surface + ': ' + row.status + version); }" "$result_file" >> "$GITHUB_STEP_SUMMARY"
            node -e "const result=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); const p=result.probeExecution; if (p) console.log('- Probe schedule: ' + p.mode + ', concurrency=' + p.concurrency + ', wallTimeMs=' + p.wallTimeMs);" "$result_file" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "Tag \`${GITHUB_REF_NAME}\` is PUBLISHED. Overall release status is COMPLETE only when all seven consumer rows are PASS; non-pass evidence keeps the release PUBLISHED/PENDING or PUBLISHED/UNHEALTHY and never edits the immutable tag."
          } >> "$GITHUB_STEP_SUMMARY"
          case "$outcome" in
            COMPLETE)
              [ "$probe_exit" -eq 0 ] || exit 1
              exit 0
              ;;
            PUBLISHED_PENDING)
              [ "$probe_exit" -eq 2 ] || exit 1
              echo "Consumer runtime evidence is pending; keeping the published tag immutable and the CI job non-blocking."
              exit 0
              ;;
            PUBLISHED_UNHEALTHY|BLOCKED)
              echo "::error::Consumer verification outcome is $outcome; inspect the emitted surface evidence." >&2
              exit 1
              ;;
            *)
              echo "::error::Unexpected consumer verification outcome: $outcome" >&2
              exit 1
              ;;
          esac

  # After a successful release, align develop only when the release PR head is
  # still current and both branches have identical trees.
  sync-develop:
    needs: [release, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Align unchanged develop to released main
        env:
          DHPK_RELEASE_EXPECTED_DEVELOP_SHA: ${{ needs.release.outputs.release_pr_head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/release/sync-develop.sh
