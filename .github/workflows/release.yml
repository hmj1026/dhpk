name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify immutable tag provenance
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release workflow: tag must match vX.Y.Z" >&2
            exit 1
          fi
          TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "release workflow: tag commit is not contained in origin/main" >&2
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Verify release parity
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/ci/verify-release-parity.js --version "$VERSION"

      - name: Verify harness facade preflight
        run: bin/dhpk harness preflight --json

      - name: Verify generated platform packages
        run: |
          for surface in agent-plugin cursor-plugin codex-native agy-plugin; do
            bin/dhpk distribution "$surface" validate --json
          done
          node scripts/ci/verify-platform-packages.js

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$(bash scripts/release/extract-notes.sh CHANGELOG.md "$VERSION")"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          # Stream notes via stdin so backticks / $(...) in CHANGELOG are not
          # expanded by the runner shell when notes are interpolated inline.
          # An existing release is preserved; tags and release metadata are immutable.
          if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; preserving it."
          else
            printf '%s' "$NOTES" | gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file -
          fi

  # Post-publish CONSUMER verification (task 4.2). Runs on a fresh, ephemeral
  # runner — the only place it's safe to run `claude plugin install` for real
  # (a dev machine's install writes to the shared global plugin cache; the
  # harness delegates Claude and Codex adapters to consumer-gate.js). Reports
  # via the job summary only — never edits the immutable GitHub Release notes.
  consumer-verify:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Installs the real `claude` CLI so the supported Claude
      # marketplace-add/install/list check runs for real here (this ephemeral
      # runner is the only place that's safe — see the job comment above). If
      # this install step itself fails, the facade records UNAVAILABLE for
      # that dimension rather than crashing.
      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code
        continue-on-error: true

      - name: Run CONSUMER gate
        run: |
          set +e
          bin/dhpk harness release --json \
            --task-id "release-consumer-${GITHUB_REF_NAME#v}" \
            | tee harness-release-result.json
          probe_exit="${PIPESTATUS[0]}"
          set -e
          outcome="$(node -e "console.log(JSON.parse(require('fs').readFileSync('harness-release-result.json','utf8')).outcome)")"
          {
            echo "## Consumer verification — ${GITHUB_REF_NAME}"
            echo ""
            echo "Outcome: \`$outcome\`"
            echo ""
            node -e "const result=JSON.parse(require('fs').readFileSync('harness-release-result.json','utf8')); for (const row of (result.surfaceResults || [])) console.log('- ' + row.surface + ': ' + row.status);" >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "Tag \`${GITHUB_REF_NAME}\` is PUBLISHED. Overall release status is COMPLETE only when all seven consumer rows are PASS; non-pass evidence keeps the release PUBLISHED/PENDING or PUBLISHED/UNHEALTHY and never edits the immutable tag."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$probe_exit"

  # git flow back-merge: after a release lands on main + tag, sync main into
  # develop so develop never falls behind. This automates the step that was
  # previously manual (and skipped — develop had drifted 76 commits behind).
  sync-develop:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Back-merge release into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # --no-ff keeps a git-flow merge commit; "Already up to date" is a
          # no-op (safe on re-run). A merge CONFLICT fails the job loudly rather
          # than silently dropping the back-merge — resolve develop by hand if so.
          git merge --no-ff origin/main \
            -m "chore(release): back-merge ${GITHUB_REF_NAME} into develop"
          git push origin HEAD:develop
